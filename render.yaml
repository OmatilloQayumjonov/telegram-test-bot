services:
  - type: web
    name: telegram-test-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_PATH
        value: data/bot.db
      - key: PYTHON_VERSION
        value: 3.11.9
